name: GKI Kernel Build - Custom

# Adapt to Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Kernel Version Configuration ====================
      android_version:
        description: "Android Version (e.g. android12, android14)"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
        default: android12
      kernel_version:
        description: "Linux Kernel Version"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      sub_level:
        description: "Kernel Sublevel (e.g. 66, 118, 236, X)"
        required: true
        type: string
        default: "236"
      os_patch_level:
        description: "Security Patch Level (e.g. 2025-05, lts)"
        required: true
        type: string
        default: "2025-05"
      revision:
        description: "Revision (e.g. r1, r11 - 5.10 only)"
        required: false
        type: string
        default: "r11"

      # ==================== KernelSU Configuration ====================
      kernelsu_branch:
        description: "BakaSU Branch (main/custom commit hash, empty=default)"
        required: false
        type: string
        default: ""

      # ==================== Optional Spoofing Configuration ====================
      version:
        description: "Custom / Spoofed Kernel Release Name (Optional)"
        required: false
        type: string
        default: "5.10.236-android12-9-00020-gf997514b333d-ab13743839"
      build_time:
        description: "Custom / Spoofed Build Timestamp (Optional, N or empty=current UTC)"
        required: false
        type: string
        default: "Mon Jul 7 16:32:37 UTC 2025"

      # ==================== Feature Switches ====================
      use_zram:
        description: "Enable ZRAM LZ4KD Enhanced Compression"
        required: true
        type: boolean
        default: true
      use_bbg:
        description: "Enable Baseband Guard (BBG) Anti-Wipe Protection"
        required: true
        type: boolean
        default: true
      use_rekernel:
        description: "Enable Re-Kernel Driver (Experimental)"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "Disable SUSFS (true=disable, false=enable)"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus 8E Processor Support"
        required: false
        type: boolean
        default: false
      droidspaces:
        description: "Droidspaces Container Support (5.10~6.6: slot patch, 6.12: on/off)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "678"
      droidspaces_ntsync:
        description: "Enable NTSync for Droidspaces Container"
        required: false
        type: boolean
        default: false
      add_zeromount:
        description: "Enable ZeroMount VFS (Mountless Hiding)"
        required: false
        type: boolean
        default: false
      add_selinux_evasion:
        description: "Enable SELinux Evasion Hooks"
        required: false
        type: boolean
        default: false
      add_nomount:
        description: "Enable NoMount VFS (Mountless Path Redirection v2.2.0)"
        required: false
        type: boolean
        default: true
      add_vpnhide:
        description: "Enable In-Tree VPNHide Backend (hide VPN interface)"
        required: false
        type: boolean
        default: true
      add_ghostlock:
        description: "Apply Ghostlock Mitigations (CVE-2026-43499 & CVE-2026-53163)"
        required: false
        type: boolean
        default: false
jobs:
  build-custom-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ inputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: ${{ inputs.revision || '' }}
      ksu_variant: "BakaSU"
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      add_zeromount: ${{ inputs.add_zeromount }}
      add_selinux_evasion: ${{ inputs.add_selinux_evasion }}
      add_nomount: ${{ inputs.add_nomount }}
      add_vpnhide: ${{ inputs.add_vpnhide }}
      add_ghostlock: ${{ inputs.add_ghostlock || false }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
